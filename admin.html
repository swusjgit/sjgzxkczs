<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>教师管理 | 信息科技课程助手</title>
    <link rel="stylesheet" href="styles.css?v=20260602-2" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="/#/home" aria-label="返回首页">
          <img src="素材/校标2.png" alt="重庆八中两江数据谷中学校校标" />
          <span class="brand-title">教师管理</span>
        </a>
        <nav class="site-nav" aria-label="管理导航">
          <a href="/#/home">返回首页</a>
          <a href="/admin.html" class="active">教师管理</a>
        </nav>
      </header>

      <main class="app admin-app">
        <section class="section-title">
          <div>
            <h1>教师管理页面</h1>
            <p>这是教师维护课程内容的页面。学生不能访问或修改这里的内容。</p>
          </div>
        </section>

        <section class="admin-panel">
          <div class="admin-token-card">
            <label for="admin-token">管理密码</label>
            <div class="admin-token-row">
              <input id="admin-token" type="password" autocomplete="off" placeholder="请输入管理密码后再保存" />
              <button class="button ghost" type="button" id="remember-token">本次会话使用</button>
            </div>
            <p>请不要把管理密码告诉学生。没有管理密码时，只能查看页面，不能修改网站内容。</p>
          </div>

          <div class="admin-layout">
            <aside class="admin-tabs" aria-label="内容类型">
              <button type="button" class="active" data-key="news">每周 AI 新闻</button>
              <button type="button" data-key="resources">资源库</button>
              <button type="button" data-key="works">学生作品</button>
              <button type="button" data-key="tools">课堂工具</button>
            </aside>

            <section class="admin-editor" aria-live="polite">
              <div class="admin-editor-head">
                <div>
                  <h2 id="dataset-title">每周 AI 新闻</h2>
                  <p id="dataset-help">编辑新闻条目、首页主推和学生思考问题。</p>
                </div>
                <span class="admin-source" id="dataset-source">等待读取</span>
              </div>

              <div class="admin-upload" id="resource-upload" hidden>
                <div>
                  <h3>上传资源</h3>
                  <p>上传 PDF、课件、压缩包或程序文件后，会自动保存到资源库，学生刷新页面即可下载。</p>
                </div>
                <div class="admin-upload-grid">
                  <label>
                    资源名称
                    <input id="resource-title" type="text" placeholder="例如：七年级数据编码任务单" />
                  </label>
                  <label>
                    分类
                    <input id="resource-category" type="text" placeholder="例如：任务单" />
                  </label>
                  <label class="admin-upload-wide">
                    说明
                    <input id="resource-description" type="text" placeholder="写一句给学生看的说明" />
                  </label>
                  <label class="admin-upload-wide">
                    选择文件
                    <input
                      id="resource-file"
                      type="file"
                      accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,.rar,.7z,.py,.cpp,.c,.h,.hpp,.java,.js,.html,.css,.txt,.md,.png,.jpg,.jpeg,.gif,.webp"
                    />
                  </label>
                </div>
                <button class="button primary" type="button" id="upload-resource">上传并保存资源</button>
              </div>

              <textarea id="json-editor" spellcheck="false" aria-label="内容编辑区"></textarea>

              <div class="admin-actions">
                <button class="button ghost" type="button" id="reload-data">重新读取</button>
                <button class="button ghost" type="button" id="format-json">整理格式</button>
                <button class="button ghost danger" type="button" id="reset-cloud">恢复默认</button>
                <button class="button primary" type="button" id="save-data">保存内容</button>
              </div>

              <div class="admin-status" id="admin-status">正在读取内容...</div>
            </section>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span class="site-footer-main">
          <span>重庆八中两江数据谷中学校</span>
          <span>信息科技课程助手</span>
        </span>
        <span class="site-footer-credit">现教中心制作@2026</span>
      </footer>
    </div>

    <script src="admin.js?v=20260602-2" defer></script>
  </body>
</html>
