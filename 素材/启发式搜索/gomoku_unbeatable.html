<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>不可战胜五子棋 AI</title>
  <style>
    :root {
      --bg: #111827;
      --panel: rgba(255, 255, 255, 0.92);
      --ink: #132033;
      --muted: #667085;
      --line: rgba(148, 163, 184, 0.35);
      --board: #d7a760;
      --board-dark: #9b682f;
      --accent: #a02b25;
      --accent-2: #0f766e;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: #f8fafc;
      background:
        radial-gradient(circle at 12% 18%, rgba(160, 43, 37, 0.34), transparent 32%),
        radial-gradient(circle at 84% 20%, rgba(15, 118, 110, 0.24), transparent 34%),
        linear-gradient(135deg, #111827, #1f2937 55%, #0f172a);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(420px, 1fr);
      gap: 26px;
      align-items: center;
      margin: 0 auto;
      padding: 28px 0;
    }

    .intro {
      display: grid;
      gap: 18px;
    }

    .badge {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      color: #d1fae5;
      font-weight: 800;
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    h1 span {
      display: block;
      color: #fca5a5;
    }

    .lead {
      margin: 0;
      color: #dbe5f0;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.8;
    }

    .thinking-card,
    .score-panel {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .thinking-card {
      padding: 18px;
    }

    .thinking-card h2 {
      margin: 0 0 10px;
      color: #fff7ed;
      font-size: 18px;
    }

    .thinking-card p {
      margin: 0;
      color: #dbe5f0;
      line-height: 1.75;
    }

    .score-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
    }

    .score {
      padding: 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }

    .score:last-child { border-right: 0; }
    .score small { display: block; color: #cbd5e1; font-size: 12px; }
    .score strong { display: block; margin-top: 4px; font-size: 28px; }

    .game {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .topbar {
      width: min(100%, 650px);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(14px);
    }

    .status {
      color: #fff;
      font-size: 16px;
      font-weight: 900;
    }

    .status small {
      display: block;
      margin-top: 3px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 0 13px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }

    button:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.18); }
    button.primary { background: var(--accent); border-color: rgba(255, 255, 255, 0.20); }
    button.secondary { background: var(--accent-2); }
    button:disabled { cursor: wait; opacity: 0.72; transform: none; }

    .board-wrap {
      width: min(100%, 650px);
      aspect-ratio: 1;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04)),
        rgba(255, 255, 255, 0.10);
      box-shadow: var(--shadow);
    }

    .board {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      border: 2px solid var(--board-dark);
      border-radius: 8px;
      background:
        linear-gradient(var(--board-dark) 1px, transparent 1px),
        linear-gradient(90deg, var(--board-dark) 1px, transparent 1px),
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.35), transparent 30%),
        var(--board);
      background-size:
        calc(100% / 14) calc(100% / 14),
        calc(100% / 14) calc(100% / 14),
        100% 100%,
        100% 100%;
      background-position:
        0 0,
        0 0,
        0 0,
        0 0;
      overflow: hidden;
    }

    .cell {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: block;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 0;
      cursor: pointer;
    }

    .cell:hover::before {
      content: "";
      position: absolute;
      inset: 22%;
      border: 2px solid rgba(160, 43, 37, 0.65);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
    }

    .stone {
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      box-shadow: 0 7px 13px rgba(0, 0, 0, 0.34);
      transform: scale(0.2);
      animation: pop 180ms ease forwards;
    }

    .stone.black {
      background:
        radial-gradient(circle at 32% 28%, #64748b, #111827 38%, #020617 78%);
    }

    .stone.white {
      background:
        radial-gradient(circle at 30% 26%, #ffffff, #e2e8f0 48%, #94a3b8 92%);
      border: 1px solid rgba(15, 23, 42, 0.12);
    }

    .stone.last {
      outline: 3px solid rgba(252, 211, 77, 0.88);
      outline-offset: 2px;
    }

    .stone.win {
      outline: 4px solid rgba(34, 197, 94, 0.95);
      outline-offset: 3px;
    }

    @keyframes pop {
      to { transform: scale(1); }
    }

    .explain {
      width: min(100%, 650px);
      min-height: 68px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.10);
      color: #dbe5f0;
      line-height: 1.65;
    }

    .explain strong {
      color: #fef3c7;
    }

    @media (max-width: 920px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        align-items: start;
        padding: 18px 0 28px;
      }

      .intro { gap: 13px; }
      .lead { font-size: 16px; }
      .board-wrap { padding: 12px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .score-panel { grid-template-columns: 1fr 1fr 1fr; }
      .score { padding: 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="intro" aria-label="游戏说明">
      <div class="badge">AI 博弈 · 搜索策略 · 评价函数</div>
      <h1>不可战胜<span>五子棋 AI</span></h1>
      <p class="lead">你执黑先手，AI 执白后手。试着寻找连续威胁，同时观察 AI 如何判断棋形、封堵路线、寻找反击机会。</p>

      <article class="thinking-card">
        <h2>思考</h2>
        <p>AI 并不是随便落子：它会先寻找“马上能赢”的位置，再拦住你马上能赢的位置，还会提前识别活四、双四、四三、双活三和连续冲四这类必胜路线。</p>
      </article>

      <div class="score-panel" aria-label="比分">
        <div class="score"><small>你</small><strong id="humanScore">0</strong></div>
        <div class="score"><small>AI</small><strong id="aiScore">0</strong></div>
        <div class="score"><small>平局</small><strong id="drawScore">0</strong></div>
      </div>
    </section>

    <section class="game" aria-label="五子棋棋盘">
      <div class="topbar">
        <div class="status" id="status">
          轮到你落子
          <small id="subStatus">黑棋先手，连成五子获胜。</small>
        </div>
        <div class="actions">
          <button class="secondary" id="hintBtn">AI 提示</button>
          <button id="undoBtn">悔一步</button>
          <button class="primary" id="resetBtn">重新开始</button>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="15 乘 15 五子棋棋盘"></div>
      </div>

      <div class="explain" id="explain">
        <strong>挑战开始：</strong>请在棋盘上落下黑子，AI 会马上回应。
      </div>
    </section>
  </main>

  <script>
    const SIZE = 15;
    const EMPTY = 0;
    const HUMAN = 1;
    const AI = 2;
    const DIRECTIONS = [
      [1, 0],
      [0, 1],
      [1, 1],
      [1, -1],
    ];

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const subStatusEl = document.getElementById("subStatus");
    const explainEl = document.getElementById("explain");
    const resetBtn = document.getElementById("resetBtn");
    const undoBtn = document.getElementById("undoBtn");
    const hintBtn = document.getElementById("hintBtn");
    const scoreEls = {
      human: document.getElementById("humanScore"),
      ai: document.getElementById("aiScore"),
      draw: document.getElementById("drawScore"),
    };

    let board = createBoard();
    let cells = [];
    let history = [];
    let gameOver = false;
    let thinking = false;
    let lastMove = null;
    let winningLine = [];
    let scores = { human: 0, ai: 0, draw: 0 };

    function createBoard() {
      return Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
    }

    function setupBoard() {
      boardEl.innerHTML = "";
      cells = [];
      for (let row = 0; row < SIZE; row += 1) {
        for (let col = 0; col < SIZE; col += 1) {
          const cell = document.createElement("button");
          cell.className = "cell";
          cell.type = "button";
          cell.dataset.row = row;
          cell.dataset.col = col;
          cell.setAttribute("role", "gridcell");
          cell.setAttribute("aria-label", `第 ${row + 1} 行，第 ${col + 1} 列`);
          cell.addEventListener("click", () => handleHumanMove(row, col));
          boardEl.appendChild(cell);
          cells.push(cell);
        }
      }
    }

    function handleHumanMove(row, col) {
      if (thinking || gameOver || board[row][col] !== EMPTY) return;
      placeMove(row, col, HUMAN);
      if (finishIfNeeded(HUMAN)) return;
      setThinking(true);
      updateStatus("AI 正在判断", "它会先看胜负威胁，再比较局面价值。");
      window.setTimeout(() => {
        const move = chooseAiMove();
        if (move) {
          placeMove(move.row, move.col, AI);
          explainEl.innerHTML = `<strong>AI 落子：</strong>${move.reason}`;
        }
        setThinking(false);
        if (!finishIfNeeded(AI)) updateStatus("轮到你落子", "小心四连、活三和双向威胁。");
      }, 260);
    }

    function placeMove(row, col, player) {
      board[row][col] = player;
      lastMove = { row, col, player };
      history.push({ row, col, player });
      render();
    }

    function finishIfNeeded(player) {
      const result = checkGame(player);
      if (!result.done) return false;
      gameOver = true;
      winningLine = result.line || [];
      render();
      if (result.winner === HUMAN) {
        scores.human += 1;
        updateStatus("你赢了！", "这一步很精彩，可以复盘你制造了哪些威胁。");
        explainEl.innerHTML = "<strong>复盘：</strong>你成功连成五子。想一想，AI 哪一步没有提前发现你的关键路线？";
      } else if (result.winner === AI) {
        scores.ai += 1;
        updateStatus("AI 获胜", "观察它是如何先防守再反击的。");
        explainEl.innerHTML = "<strong>复盘：</strong>AI 连成五子。可以尝试提前封堵它的连续威胁。";
      } else {
        scores.draw += 1;
        updateStatus("平局", "棋盘下满，没有一方连成五子。");
        explainEl.innerHTML = "<strong>复盘：</strong>你把 AI 拖到了最后，说明防守路线很稳。";
      }
      updateScores();
      return true;
    }

    function checkGame(player) {
      const winner = findWinner(player);
      if (winner) return { done: true, winner: player, line: winner };
      if (getEmptyCells().length === 0) return { done: true, winner: "draw" };
      return { done: false };
    }

    function findWinner(player) {
      for (let row = 0; row < SIZE; row += 1) {
        for (let col = 0; col < SIZE; col += 1) {
          if (board[row][col] !== player) continue;
          for (const [dr, dc] of DIRECTIONS) {
            const line = [];
            for (let step = 0; step < 5; step += 1) {
              const r = row + dr * step;
              const c = col + dc * step;
              if (!inside(r, c) || board[r][c] !== player) break;
              line.push({ row: r, col: c });
            }
            if (line.length === 5) return line;
          }
        }
      }
      return null;
    }

    function chooseAiMove() {
      const candidates = getCandidateMoves();
      if (!candidates.length) return { row: 7, col: 7, reason: "中心位置能连接更多方向，适合作为开局点。" };

      const winning = findTacticalMove(AI, candidates);
      if (winning) return { ...winning, reason: "这里可以马上连成五子，所以 AI 直接完成进攻。" };

      const blocking = findTacticalMove(HUMAN, candidates);
      if (blocking) return { ...blocking, reason: "你下一步可能连成五子，AI 必须优先封堵。" };

      const preventive = findBestPreventiveMove(candidates);
      if (preventive) return preventive;

      const urgentBlock = findBestThreatBlock(candidates);
      if (urgentBlock) return urgentBlock;

      const forcing = findBestForcingMove(AI, candidates);
      if (forcing) return forcing;

      let best = null;
      for (const move of candidates) {
        board[move.row][move.col] = AI;
        const aiScore = evaluateBoard(AI);
        const humanAfter = evaluateBoard(HUMAN);
        const replyDanger = estimateHumanReply(move);
        const safety = evaluateHumanDanger(0);
        board[move.row][move.col] = EMPTY;
        const centerBias = 18 - (Math.abs(move.row - 7) + Math.abs(move.col - 7));
        const forcedDanger = replyDanger >= 16000000 || safety.risk >= 16000000;
        const score = aiScore * 1.15 + humanAfter * 0.86 + centerBias * 7 - replyDanger * 1.25 - safety.risk * 1.15 - (forcedDanger ? 65000000 : 0);
        if (!best || score > best.score) {
          best = {
            row: move.row,
            col: move.col,
            score,
            reason: describeMove(move, aiScore, humanAfter, Math.max(replyDanger, safety.risk)),
          };
        }
      }
      return best;
    }

    function findTacticalMove(player, candidates) {
      const moves = findTacticalMoves(player, candidates);
      return moves[0] || null;
    }

    function findTacticalMoves(player, candidates = getCandidateMoves(2)) {
      const moves = [];
      for (const move of candidates) {
        board[move.row][move.col] = player;
        const win = Boolean(findWinner(player));
        board[move.row][move.col] = EMPTY;
        if (win) moves.push(move);
      }
      return moves;
    }

    function findBestThreatBlock(candidates) {
      let best = null;
      for (const move of candidates) {
        board[move.row][move.col] = HUMAN;
        const profile = analyzeThreatAt(move.row, move.col, HUMAN);
        const threat = threatSeverity(profile) + scorePoint(move.row, move.col, HUMAN);
        board[move.row][move.col] = EMPTY;
        if (threat >= 900000 && (!best || threat > best.threat)) {
          best = { ...move, threat, profile };
        }
      }
      if (!best) return null;
      return {
        row: best.row,
        col: best.col,
        threat: best.threat,
        profile: best.profile,
        reason: threatReason(best.profile),
      };
    }

    function findBestPreventiveMove(candidates) {
      const currentDanger = evaluateHumanDanger(1);
      const searchCandidates = focusedDefenseCandidates(candidates).slice(0, 18);
      let best = null;
      for (const move of searchCandidates) {
        board[move.row][move.col] = AI;
        const safety = evaluateHumanDanger(1);
        const continuationRisk = currentDanger.risk >= 3500000 ? estimateContinuationRisk() : 0;
        const aiProfile = analyzeThreatAt(move.row, move.col, AI);
        const attackValue = threatSeverity(aiProfile) + scorePoint(move.row, move.col, AI);
        const centerBias = 18 - (Math.abs(move.row - 7) + Math.abs(move.col - 7));
        board[move.row][move.col] = EMPTY;
        const totalRisk = safety.risk + continuationRisk;
        const score = attackValue * 0.72 + centerBias * 1200 - totalRisk;
        if (!best || totalRisk < best.totalRisk || (totalRisk === best.totalRisk && score > best.score)) {
          best = { ...move, safety, continuationRisk, totalRisk, score, attackValue };
        }
      }
      if (!best) return null;
      const needsDefense = currentDanger.risk >= 900000 || best.safety.risk >= 16000000;
      if (!needsDefense) return null;
      return {
        row: best.row,
        col: best.col,
        reason: preventiveReason(best.safety, currentDanger),
      };
    }

    function focusedDefenseCandidates(candidates) {
      return candidates.map((move) => {
        board[move.row][move.col] = HUMAN;
        const humanProfile = analyzeThreatAt(move.row, move.col, HUMAN);
        if (findWinner(HUMAN)) humanProfile.win = true;
        const humanThreat = threatSeverity(humanProfile) + scorePoint(move.row, move.col, HUMAN);
        board[move.row][move.col] = EMPTY;
        const aiValue = scorePoint(move.row, move.col, AI);
        const centerBias = 18 - (Math.abs(move.row - 7) + Math.abs(move.col - 7));
        return { ...move, priority: humanThreat * 1.5 + aiValue * 0.7 + centerBias * 500 };
      }).sort((a, b) => b.priority - a.priority);
    }

    function estimateContinuationRisk() {
      const humanMoves = findThreatMoves(HUMAN, getCandidateMoves(2), 3500000).slice(0, 3);
      let worst = 0;
      for (const humanMove of humanMoves) {
        board[humanMove.row][humanMove.col] = HUMAN;
        let risk = 0;
        if (findWinner(HUMAN)) {
          risk = 900000000;
        } else {
          const defense = chooseSimpleDefense();
          if (defense) {
            board[defense.row][defense.col] = AI;
            const danger = evaluateHumanDanger(0);
            risk = danger.risk;
            if (danger.immediateWins.length > 0) risk += 260000000;
            if (danger.unavoidableCount > 0) risk += 90000000;
            board[defense.row][defense.col] = EMPTY;
          } else {
            risk = 500000000;
          }
        }
        board[humanMove.row][humanMove.col] = EMPTY;
        worst = Math.max(worst, risk);
      }
      return worst;
    }

    function chooseSimpleDefense() {
      const candidates = getCandidateMoves(2);
      const win = findTacticalMove(AI, candidates);
      if (win) return win;
      const block = findTacticalMove(HUMAN, candidates);
      if (block) return block;
      const threatBlock = findBestThreatBlock(candidates);
      if (threatBlock) return threatBlock;
      let best = null;
      for (const move of candidates) {
        const score = scorePoint(move.row, move.col, AI) + scorePoint(move.row, move.col, HUMAN) * 1.1;
        if (!best || score > best.score) best = { ...move, score };
      }
      return best;
    }

    function findBestForcingMove(player, candidates) {
      let best = null;
      for (const move of candidates) {
        board[move.row][move.col] = player;
        const profile = analyzeThreatAt(move.row, move.col, player);
        const threat = threatSeverity(profile) + scorePoint(move.row, move.col, player);
        const replyDanger = player === AI ? estimateHumanReply(move) : 0;
        const safety = player === AI ? evaluateHumanDanger(0) : { risk: 0 };
        board[move.row][move.col] = EMPTY;
        const safeThreat = threat - replyDanger * 1.2 - safety.risk * 1.2;
        if (threat >= 1600000 && replyDanger < 30000000 && safety.risk < 30000000 && (!best || safeThreat > best.safeThreat)) {
          best = { ...move, threat, safeThreat, profile };
        }
      }
      if (!best) return null;
      return {
        row: best.row,
        col: best.col,
        reason: "AI 先制造必须回应的威胁，让下一步进攻更主动。",
      };
    }

    function estimateHumanReply(aiMove) {
      let danger = 0;
      const candidates = getCandidateMoves(2);
      for (const move of candidates) {
        if (move.row === aiMove.row && move.col === aiMove.col) continue;
        board[move.row][move.col] = HUMAN;
        const profile = analyzeThreatAt(move.row, move.col, HUMAN);
        const threat = threatSeverity(profile) + scorePoint(move.row, move.col, HUMAN);
        danger = Math.max(danger, threat);
        board[move.row][move.col] = EMPTY;
      }
      return danger;
    }

    function evaluateHumanDanger(depth = 0) {
      const candidates = getCandidateMoves(2);
      const immediateWins = findTacticalMoves(HUMAN, candidates);
      const threats = findThreatMoves(HUMAN, candidates, 45000);
      const strongest = threats[0];
      const unavoidable = threats.filter(item => isUnavoidableThreat(item.profile));
      const strongThreats = threats.filter(item => item.profile.simpleFour >= 1 || item.profile.openThree >= 1);
      const forced = depth > 0 && hasThreatSequence(HUMAN, AI, depth);
      let risk = strongest ? strongest.threat : 0;
      if (immediateWins.length > 0) risk += immediateWins.length * 220000000;
      if (unavoidable.length > 0) risk += unavoidable.length * 90000000;
      if (strongThreats.length > 1) risk += (strongThreats.length - 1) * 12000000;
      if (forced) risk += 180000000;
      return {
        risk,
        forced,
        immediateWins,
        strongest,
        unavoidableCount: unavoidable.length,
        strongCount: strongThreats.length,
      };
    }

    function findThreatMoves(player, candidates = getCandidateMoves(2), minThreat = 900000) {
      const moves = [];
      for (const move of candidates) {
        board[move.row][move.col] = player;
        const profile = analyzeThreatAt(move.row, move.col, player);
        if (findWinner(player)) profile.win = true;
        const threat = threatSeverity(profile) + scorePoint(move.row, move.col, player);
        board[move.row][move.col] = EMPTY;
        if (threat >= minThreat) moves.push({ ...move, profile, threat });
      }
      return moves.sort((a, b) => b.threat - a.threat);
    }

    function isUnavoidableThreat(profile) {
      return profile.win
        || profile.openFour > 0
        || profile.simpleFour >= 2
        || (profile.simpleFour >= 1 && profile.openThree >= 1)
        || profile.openThree >= 2;
    }

    function hasThreatSequence(attacker, defender, depth) {
      const wins = findTacticalMoves(attacker, getCandidateMoves(1));
      if (wins.length > 0) return true;
      if (depth <= 0) return false;
      const minAttack = depth > 1 ? 900000 : 3500000;
      const attacks = findThreatMoves(attacker, getCandidateMoves(2), minAttack).slice(0, 4);
      for (const attack of attacks) {
        board[attack.row][attack.col] = attacker;
        const directWins = findTacticalMoves(attacker, getCandidateMoves(1));
        let forced = Boolean(findWinner(attacker)) || directWins.length >= 2 || isUnavoidableThreat(attack.profile);
        if (!forced) {
          const defenses = getDefenseMoves(attacker, defender, directWins).slice(0, 5);
          forced = defenses.length > 0 && defenses.every((defense) => {
            board[defense.row][defense.col] = defender;
            const defenderWins = Boolean(findWinner(defender));
            const stillForced = !defenderWins && hasThreatSequence(attacker, defender, depth - 1);
            board[defense.row][defense.col] = EMPTY;
            return stillForced;
          });
        }
        board[attack.row][attack.col] = EMPTY;
        if (forced) return true;
      }
      return false;
    }

    function getDefenseMoves(attacker, defender, directWins) {
      const moves = new Map();
      const add = (move) => {
        if (!move || board[move.row][move.col] !== EMPTY) return;
        moves.set(`${move.row},${move.col}`, { row: move.row, col: move.col });
      };
      directWins.forEach(add);
      findTacticalMoves(defender, getCandidateMoves(1)).forEach(add);
      findThreatMoves(attacker, getCandidateMoves(2), 3500000).slice(0, 4).forEach(add);
      findThreatMoves(defender, getCandidateMoves(2), 3500000).slice(0, 2).forEach(add);
      return Array.from(moves.values());
    }

    function describeMove(move, aiScore, humanScore, replyDanger) {
      if (aiScore > humanScore * 1.18) return "AI 选择扩大自己的连续棋形，准备制造下一轮威胁。";
      if (replyDanger > 16000000) return "AI 提前看到了你的必胜路线，所以先把关键点占住。";
      if (replyDanger > 1200000) return "AI 预判到你可能形成双向威胁，所以把棋落在更安全的位置。";
      if (replyDanger > 18000) return "AI 预判到你可能形成强攻，所以把棋落在更安全的位置。";
      return "AI 选择同时兼顾进攻和防守的位置，让多个方向保持连接。";
    }

    function preventiveReason(safety, currentDanger) {
      if (currentDanger.immediateWins.length > 1 || safety.immediateWins.length > 1) return "你已经形成多个连五入口，AI 选择先堵最危险的路线。";
      if (currentDanger.immediateWins.length > 0 || safety.immediateWins.length > 0) return "你下一手可能直接连成五子，AI 必须先封住。";
      if (currentDanger.forced || safety.forced) return "AI 看到了连续冲四的进攻链，先切断关键连接点。";
      if (currentDanger.unavoidableCount > 0 || safety.unavoidableCount > 0) return "AI 提前防住活四、双四或双活三，避免你形成一步挡不完的局面。";
      if (currentDanger.strongCount > 1 || safety.strongCount > 1) return "AI 发现你有多个方向可以继续进攻，先压住最危险的交叉点。";
      return "AI 先把你的潜在强攻点占住，避免后面被连续威胁牵着走。";
    }

    function analyzeThreatAt(row, col, player) {
      const profile = {
        win: false,
        openFour: 0,
        simpleFour: 0,
        openThree: 0,
        liveTwo: 0,
      };
      for (const [dr, dc] of DIRECTIONS) {
        const line = lineString(row, col, dr, dc, player);
        const flags = lineThreatFlags(line);
        if (flags.win) profile.win = true;
        if (flags.openFour) profile.openFour += 1;
        if (flags.simpleFour) profile.simpleFour += 1;
        if (flags.openThree) profile.openThree += 1;
        if (flags.liveTwo) profile.liveTwo += 1;
      }
      return profile;
    }

    function lineString(row, col, dr, dc, player) {
      const tokens = [];
      for (let step = -4; step <= 4; step += 1) {
        const r = row + dr * step;
        const c = col + dc * step;
        if (!inside(r, c)) {
          tokens.push("B");
        } else if (board[r][c] === player) {
          tokens.push("P");
        } else if (board[r][c] === EMPTY) {
          tokens.push("_");
        } else {
          tokens.push("B");
        }
      }
      return tokens.join("");
    }

    function lineThreatFlags(line) {
      return {
        win: line.includes("PPPPP"),
        openFour: line.includes("_PPPP_"),
        simpleFour: hasWindow(line, 5, segment => !segment.includes("B") && countChar(segment, "P") === 4 && countChar(segment, "_") === 1),
        openThree: /_PPP_|_PP_P_|_P_PP_/.test(line),
        liveTwo: /__PP__|__P_P__/.test(line),
      };
    }

    function threatSeverity(profile) {
      if (profile.win) return 100000000;
      if (profile.openFour > 0) return 50000000;
      if (profile.simpleFour >= 2) return 30000000;
      if (profile.simpleFour >= 1 && profile.openThree >= 1) return 22000000;
      if (profile.openThree >= 2) return 16000000;
      if (profile.simpleFour >= 1) return 3500000;
      if (profile.openThree >= 1) return 900000;
      if (profile.liveTwo >= 2) return 180000;
      if (profile.liveTwo >= 1) return 45000;
      return 0;
    }

    function threatReason(profile) {
      if (profile.openFour > 0 || profile.simpleFour >= 2) return "这里能压住你的冲四威胁，AI 必须先防守。";
      if (profile.simpleFour >= 1 && profile.openThree >= 1) return "这里会形成“四三”组合，AI 先把关键点封住。";
      if (profile.openThree >= 2) return "这里会形成双活三，AI 先封住这个交叉威胁点。";
      if (profile.openThree >= 1) return "这里能形成活三，AI 先压住你的连续进攻。";
      return "这里能压住你的强威胁，先防守可以避免局面失控。";
    }

    function hasWindow(line, size, predicate) {
      for (let index = 0; index <= line.length - size; index += 1) {
        if (predicate(line.slice(index, index + size))) return true;
      }
      return false;
    }

    function countChar(text, target) {
      return Array.from(text).filter(char => char === target).length;
    }

    function evaluateBoard(player) {
      let total = 0;
      for (let row = 0; row < SIZE; row += 1) {
        for (let col = 0; col < SIZE; col += 1) {
          if (board[row][col] === player) total += scorePoint(row, col, player);
        }
      }
      return total;
    }

    function scorePoint(row, col, player) {
      let total = 0;
      for (const [dr, dc] of DIRECTIONS) {
        total += scoreDirection(row, col, dr, dc, player);
      }
      return total;
    }

    function scoreDirection(row, col, dr, dc, player) {
      const left = countLine(row, col, -dr, -dc, player);
      const right = countLine(row, col, dr, dc, player);
      const count = left.count + right.count + 1;
      const openEnds = Number(left.open) + Number(right.open);
      const blockedByOpponent = 2 - openEnds;

      if (count >= 5) return 1000000;
      if (count === 4 && openEnds === 2) return 160000;
      if (count === 4 && openEnds === 1) return 48000;
      if (count === 3 && openEnds === 2) return 18000;
      if (count === 3 && openEnds === 1) return 4200;
      if (count === 2 && openEnds === 2) return 1200;
      if (count === 2 && openEnds === 1) return 250;
      if (count === 1 && openEnds === 2) return 70;
      return Math.max(10, 30 - blockedByOpponent * 8);
    }

    function countLine(row, col, dr, dc, player) {
      let count = 0;
      let r = row + dr;
      let c = col + dc;
      while (inside(r, c) && board[r][c] === player) {
        count += 1;
        r += dr;
        c += dc;
      }
      return { count, open: inside(r, c) && board[r][c] === EMPTY };
    }

    function getCandidateMoves(radius = 2) {
      const moves = new Map();
      const stones = [];
      for (let row = 0; row < SIZE; row += 1) {
        for (let col = 0; col < SIZE; col += 1) {
          if (board[row][col] !== EMPTY) stones.push({ row, col });
        }
      }
      if (!stones.length) return [{ row: 7, col: 7 }];
      for (const item of stones) {
        for (let dr = -radius; dr <= radius; dr += 1) {
          for (let dc = -radius; dc <= radius; dc += 1) {
            const row = item.row + dr;
            const col = item.col + dc;
            if (!inside(row, col) || board[row][col] !== EMPTY) continue;
            moves.set(`${row},${col}`, { row, col });
          }
        }
      }
      return Array.from(moves.values()).sort((a, b) => {
        const ad = Math.abs(a.row - 7) + Math.abs(a.col - 7);
        const bd = Math.abs(b.row - 7) + Math.abs(b.col - 7);
        return ad - bd;
      });
    }

    function getEmptyCells() {
      const empty = [];
      for (let row = 0; row < SIZE; row += 1) {
        for (let col = 0; col < SIZE; col += 1) {
          if (board[row][col] === EMPTY) empty.push({ row, col });
        }
      }
      return empty;
    }

    function render() {
      cells.forEach((cell) => {
        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);
        const value = board[row][col];
        const isLast = lastMove && lastMove.row === row && lastMove.col === col;
        const isWin = winningLine.some((item) => item.row === row && item.col === col);
        cell.innerHTML = value
          ? `<span class="stone ${value === HUMAN ? "black" : "white"} ${isLast ? "last" : ""} ${isWin ? "win" : ""}"></span>`
          : "";
        cell.disabled = thinking || gameOver || value !== EMPTY;
        cell.setAttribute("aria-label", cellLabel(row, col, value));
      });
    }

    function cellLabel(row, col, value) {
      const text = value === HUMAN ? "黑子" : value === AI ? "白子" : "空位";
      return `第 ${row + 1} 行，第 ${col + 1} 列，${text}`;
    }

    function updateStatus(main, sub) {
      statusEl.innerHTML = `${main}<small id="subStatus">${sub}</small>`;
    }

    function updateScores() {
      scoreEls.human.textContent = scores.human;
      scoreEls.ai.textContent = scores.ai;
      scoreEls.draw.textContent = scores.draw;
    }

    function setThinking(value) {
      thinking = value;
      resetBtn.disabled = value;
      undoBtn.disabled = value || history.length < 2 || gameOver;
      hintBtn.disabled = value || gameOver;
      render();
    }

    function resetGame() {
      board = createBoard();
      history = [];
      gameOver = false;
      thinking = false;
      lastMove = null;
      winningLine = [];
      updateStatus("轮到你落子", "黑棋先手，AI 会提前防住关键路线。");
      explainEl.innerHTML = "<strong>挑战开始：</strong>请在棋盘上落下黑子，观察 AI 如何防守和反击。";
      setThinking(false);
      render();
    }

    function undoPair() {
      if (thinking || history.length < 2 || gameOver) return;
      for (let i = 0; i < 2; i += 1) {
        const move = history.pop();
        if (move) board[move.row][move.col] = EMPTY;
      }
      lastMove = history[history.length - 1] || null;
      updateStatus("轮到你落子", "已悔一步，请重新观察棋形。");
      explainEl.innerHTML = "<strong>重新思考：</strong>悔棋后可以尝试制造两个方向的连续威胁。";
      render();
    }

    function showHint() {
      if (thinking || gameOver) return;
      const candidates = getCandidateMoves();
      const winning = findTacticalMove(HUMAN, candidates);
      if (winning) {
        explainEl.innerHTML = `<strong>提示：</strong>第 ${winning.row + 1} 行第 ${winning.col + 1} 列已经是很强的胜利点，AI 通常会优先防住这一类路线。`;
        return;
      }
      let best = null;
      for (const move of candidates) {
        board[move.row][move.col] = HUMAN;
        const profile = analyzeThreatAt(move.row, move.col, HUMAN);
        const score = threatSeverity(profile) + scorePoint(move.row, move.col, HUMAN);
        const blocked = isUnavoidableHumanThreat(profile);
        board[move.row][move.col] = EMPTY;
        if (!best || (best.blocked && !blocked) || (best.blocked === blocked && score > best.score)) best = { ...move, score, blocked };
      }
      if (best && best.blocked) {
        explainEl.innerHTML = `<strong>提示：</strong>第 ${best.row + 1} 行第 ${best.col + 1} 列会形成强威胁，AI 大概率会提前防守。你可以尝试用多个方向牵制它。`;
      } else if (best) {
        explainEl.innerHTML = `<strong>提示：</strong>可以观察第 ${best.row + 1} 行第 ${best.col + 1} 列，它可能帮你形成更长的连续棋形。`;
      }
    }

    function inside(row, col) {
      return row >= 0 && row < SIZE && col >= 0 && col < SIZE;
    }

    setupBoard();
    resetGame();
    resetBtn.addEventListener("click", resetGame);
    undoBtn.addEventListener("click", undoPair);
    hintBtn.addEventListener("click", showHint);
  </script>
</body>
</html>
