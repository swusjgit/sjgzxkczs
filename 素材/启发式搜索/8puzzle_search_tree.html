<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八数码 - 搜索树</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(0,0,0,0.4);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { color: #00d9ff; font-size: 1rem; }
        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            padding: 5px 12px;
            font-size: 0.8rem;
            background: linear-gradient(135deg, #00d9ff, #0099cc);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        button.secondary { background: rgba(255,255,255,0.15); color: white; }
        button.danger { background: #ff6b6b; color: white; }
        .zoom-group {
            display: flex;
            gap: 4px;
            margin-left: 10px;
            padding-left: 10px;
            border-left: 1px solid rgba(255,255,255,0.2);
        }
        .zoom-group span { font-size: 0.75rem; color: #888; min-width: 40px; text-align: center; }
        .diff-group {
            display: flex;
            gap: 4px;
            margin-left: 10px;
            padding-left: 10px;
            border-left: 1px solid rgba(255,255,255,0.2);
        }
        .diff-group button {
            background: rgba(0,255,136,0.2);
            color: #00ff88;
            padding: 4px 10px;
            font-size: 0.75rem;
        }
        .custom-group {
            display: flex;
            gap: 5px;
            margin-left: 10px;
            padding-left: 10px;
            border-left: 1px solid rgba(255,255,255,0.2);
            align-items: center;
        }
        .custom-group input {
            width: 100px;
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 0.75rem;
        }
        .custom-group input::placeholder { color: #666; }
        .custom-group button {
            background: rgba(0,255,136,0.2);
            color: #00ff88;
            padding: 4px 10px;
            font-size: 0.75rem;
        }

        .tree-wrapper {
            padding: 30px;
            min-width: 100%;
            position: relative;
        }
        .tree-svg {
            display: block;
            min-width: 100%;
            overflow: visible;
        }
        .edge {
            fill: none;
            stroke: rgba(0,217,255,0.28);
            stroke-width: 1.4;
        }
        .edge.solution {
            stroke: #00ff88;
            stroke-width: 4;
            filter: drop-shadow(0 0 5px rgba(0,255,136,0.75));
        }
        .svg-node .board-shell {
            fill: rgba(255,255,255,0.08);
            stroke: rgba(255,255,255,0.16);
            stroke-width: 2;
            rx: 6;
        }
        .svg-node.solution .board-shell {
            stroke: #00ff88;
            stroke-width: 3;
            filter: drop-shadow(0 0 6px rgba(0,255,136,0.65));
        }
        .svg-node.goal .board-shell {
            fill: rgba(0,255,136,0.12);
            stroke: #00ff88;
            stroke-width: 3;
            filter: drop-shadow(0 0 8px rgba(0,255,136,0.85));
        }
        .tile {
            fill: #f8fbff;
            rx: 3;
        }
        .tile.empty {
            fill: rgba(0,217,255,0.24);
        }
        .tile-text {
            fill: #26313f;
            font-weight: 700;
            dominant-baseline: middle;
            text-anchor: middle;
        }
        .move-label, .depth-label, .node-badge, .path-step {
            font-family: 'Segoe UI', sans-serif;
            text-anchor: middle;
        }
        .move-label { fill: #8d95a8; font-size: 12px; }
        .depth-label { fill: #00d9ff; font-size: 12px; font-weight: 700; }
        .node-badge {
            fill: #1a1a2e;
            font-size: 10px;
            font-weight: 700;
            dominant-baseline: middle;
        }
        .badge-bg {
            fill: #00ff88;
            rx: 10;
        }
        .path-step {
            fill: #1a1a2e;
            font-size: 11px;
            font-weight: 700;
            dominant-baseline: middle;
        }
        .path-step-bg { fill: #00ff88; }
        .muted-after-solution {
            opacity: 0.34;
        }
        .tree-level {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }
        .level-label {
            font-size: 0.65rem;
            color: #00d9ff;
            background: rgba(0,0,0,0.5);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            margin-bottom: 8px;
        }
        .nodes-row {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            overflow-x: auto;
            padding: 5px 0;
            justify-content: center;
            width: 100%;
        }
        .tree-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
        .node-board {
            display: grid;
            grid-template-columns: repeat(3, var(--cell-size, 38px));
            grid-template-rows: repeat(3, var(--cell-size, 38px));
            gap: 1px;
            background: rgba(255,255,255,0.1);
            padding: 3px;
            border-radius: 4px;
            border: 2px solid transparent;
            position: relative;
        }
        .node-board.goal { border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.5); }
        .node-board.current { border-color: #00ff88; }
        .node-board.path-highlight { border-color: #00ff88; box-shadow: 0 0 12px rgba(0,255,136,0.5); }
        .goal-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #00ff88;
            color: #1a1a2e;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
        }
        .node-cell {
            width: var(--cell-size, 38px);
            height: var(--cell-size, 38px);
            background: white;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(var(--cell-size, 38px) * 0.4);
            font-weight: bold;
            color: #333;
        }
        .node-cell.empty { background: rgba(0,217,255,0.3); color: #0099cc; }
        .node-move { margin-top: 4px; font-size: 0.6rem; color: #888; min-height: 14px; }
        .collapsed-info {
            padding: 15px 25px;
            color: #666;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .collapsed-info button {
            padding: 3px 8px;
            font-size: 0.7rem;
            background: rgba(0,217,255,0.2);
            color: #00d9ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .info-bar {
            display: flex;
            gap: 20px;
            padding: 5px 15px;
            background: rgba(0,0,0,0.2);
            font-size: 0.75rem;
            color: #888;
            position: sticky;
            bottom: 0;
        }
        .info-bar span { color: #00ff88; }
        .solution-banner {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a1a2e;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin: 0 auto 15px;
            display: inline-block;
        }
        .path-display {
            color: #888;
            font-size: 0.7rem;
            margin-top: 8px;
            max-width: 300px;
            text-align: center;
        }
        .tree-container {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>八数码搜索树</h1>
        <div class="controls">
            <button onclick="expandNext()" id="expandBtn">展开层</button>
            <button onclick="solveUntilGoal()" id="solveBtn">自动找解</button>
            <button class="danger" onclick="collapseAll()">折叠</button>
            <button class="secondary" onclick="resetTree()">重置</button>
            <div class="diff-group">
                <button onclick="randomStart(5)">简单</button>
                <button onclick="randomStart(10)">中等</button>
                <button onclick="randomStart(20)">困难</button>
            </div>
            <div class="custom-group">
                <input type="text" id="customInput" placeholder="行输入如: 103824765" maxlength="9">
                <button onclick="setCustomState()">自定义</button>
            </div>
            <div class="zoom-group">
                <button onclick="zoomIn()">+</button>
                <span id="zoomLabel">100%</span>
                <button onclick="zoomOut()">-</button>
            </div>
        </div>
    </div>

    <div class="tree-wrapper" id="treeWrapper">
        <div id="treeContent"></div>
    </div>

    <div class="info-bar">
        <div>节点: <span id="nodeCount">1</span></div>
        <div>深度: <span id="maxDepth">0</span></div>
        <div id="goalInfo"></div>
    </div>

    <script>
        const goalState = [[1,2,3],[8,0,4],[7,6,5]];
        let treeNodes = [];
        let nodeCounter = 1;
        let maxExpandedDepth = 0;
        let currentScale = 1;
        let currentStartState = null;
        let foundGoal = false;
        let goalNodeIndex = -1;
        let pathNodes = [];
        let goalAncestors = new Set();

        function boardEqual(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
        function deepCopy(b) { return b.map(r => [...r]); }
        function findEmpty(b) { for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) if (b[r][c] === 0) return {r, c}; }
        function getMoves(b) {
            const empty = findEmpty(b);
            const dirs = [[-1,0,'上'],[1,0,'下'],[0,-1,'左'],[0,1,'右']];
            return dirs.filter(([dr,dc]) => {
                const nr = empty.r + dr, nc = empty.c + dc;
                return nr >= 0 && nr < 3 && nc >= 0 && nc < 3;
            }).map(([dr,dc,name]) => ({r: empty.r + dr, c: empty.c + dc, name}));
        }

        function getCellSize() { return Math.round(38 * currentScale); }

        function buildPathToRoot(nodeIndex) {
            const path = [];
            let current = nodeIndex;
            while (current !== -1) {
                path.unshift(current);
                current = treeNodes[current].parentIndex;
            }
            return path;
        }

        function markGoalAncestors() {
            goalAncestors.clear();
            for (let i = 0; i < pathNodes.length - 1; i++) {
                goalAncestors.add(pathNodes[i]);
            }
        }

        function boardKey(board) {
            return board.flat().join('');
        }

        function getVisibleNodes() {
            return treeNodes
                .map((node, index) => ({...node, index}))
                .filter(node => node.depth <= maxExpandedDepth);
        }

        function getSolutionMoveText() {
            if (!pathNodes.length) return '';
            return pathNodes
                .slice(1)
                .map(index => treeNodes[index].moveName)
                .join(' -> ');
        }

        function renderBoardSvg(node, x, y, metrics, pathStep) {
            const {nodeWidth, boardSize, tileSize, tileGap, boardPad} = metrics;
            const boardX = x + (nodeWidth - boardSize) / 2;
            const boardY = y + 18;
            const isGoal = node.index === goalNodeIndex;
            const isSolution = pathNodes.includes(node.index);
            const isMuted = foundGoal && !isSolution;
            let html = `<g class="svg-node${isSolution ? ' solution' : ''}${isGoal ? ' goal' : ''}${isMuted ? ' muted-after-solution' : ''}" id="node-${node.index}">`;

            if (node.depth === 0 || isGoal) {
                const label = isGoal ? '目标' : '起点';
                const badgeX = x + nodeWidth / 2;
                html += `<rect class="badge-bg" x="${badgeX - 18}" y="${y}" width="36" height="18"></rect>`;
                html += `<text class="node-badge" x="${badgeX}" y="${y + 9}">${label}</text>`;
            }

            if (pathStep >= 0) {
                html += `<circle class="path-step-bg" cx="${x + nodeWidth - 10}" cy="${boardY + 8}" r="10"></circle>`;
                html += `<text class="path-step" x="${x + nodeWidth - 10}" y="${boardY + 8}">${pathStep}</text>`;
            }

            html += `<rect class="board-shell" x="${boardX}" y="${boardY}" width="${boardSize}" height="${boardSize}"></rect>`;
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const value = node.board[r][c];
                    const tx = boardX + boardPad + c * (tileSize + tileGap);
                    const ty = boardY + boardPad + r * (tileSize + tileGap);
                    html += `<rect class="tile${value === 0 ? ' empty' : ''}" x="${tx}" y="${ty}" width="${tileSize}" height="${tileSize}"></rect>`;
                    if (value !== 0) {
                        html += `<text class="tile-text" x="${tx + tileSize / 2}" y="${ty + tileSize / 2}" font-size="${Math.max(12, Math.round(tileSize * 0.42))}">${value}</text>`;
                    }
                }
            }
            html += `<text class="move-label" x="${x + nodeWidth / 2}" y="${boardY + boardSize + 17}">${node.moveName || ''}</text>`;
            html += '</g>';
            return html;
        }

        function renderSvgTree(visibleNodes) {
            const byIndex = new Map(visibleNodes.map(node => [node.index, node]));
            const children = new Map();
            visibleNodes.forEach(node => {
                if (node.parentIndex >= 0 && byIndex.has(node.parentIndex)) {
                    if (!children.has(node.parentIndex)) children.set(node.parentIndex, []);
                    children.get(node.parentIndex).push(node.index);
                }
            });

            const cellSize = getCellSize();
            const tileGap = Math.max(1, Math.round(1 * currentScale));
            const boardPad = Math.max(3, Math.round(4 * currentScale));
            const boardSize = cellSize * 3 + tileGap * 2 + boardPad * 2;
            const nodeWidth = Math.max(boardSize + 24, Math.round(118 * currentScale));
            const nodeHeight = boardSize + 42;
            const hGap = Math.max(18, Math.round(34 * currentScale));
            const vGap = Math.max(58, Math.round(82 * currentScale));
            const marginX = 45;
            const marginY = 34;
            const metrics = {nodeWidth, nodeHeight, boardSize, tileSize: cellSize, tileGap, boardPad};
            const positions = new Map();
            let nextX = marginX + nodeWidth / 2;

            function layout(index) {
                const node = byIndex.get(index);
                const childIds = children.get(index) || [];
                if (childIds.length === 0) {
                    positions.set(index, {
                        cx: nextX,
                        y: marginY + node.depth * (nodeHeight + vGap)
                    });
                    nextX += nodeWidth + hGap;
                    return;
                }
                childIds.forEach(layout);
                const first = positions.get(childIds[0]).cx;
                const last = positions.get(childIds[childIds.length - 1]).cx;
                positions.set(index, {
                    cx: (first + last) / 2,
                    y: marginY + node.depth * (nodeHeight + vGap)
                });
            }

            layout(0);

            const maxDepth = Math.max(...visibleNodes.map(node => node.depth), 0);
            if (maxDepth > 1) {
                const rootCenter = positions.get(0).cx;
                const levels = new Map();
                visibleNodes.forEach(node => {
                    if (!levels.has(node.depth)) levels.set(node.depth, []);
                    levels.get(node.depth).push(node.index);
                });

                positions.forEach((pos, index) => {
                    const node = byIndex.get(index);
                    const depthRatio = node.depth / maxDepth;
                    const compactFactor = Math.min(1, 0.34 + Math.pow(depthRatio, 1.35) * 0.66);
                    pos.cx = rootCenter + (pos.cx - rootCenter) * compactFactor;
                });

                const minLevelGap = nodeWidth * 0.82;
                levels.forEach(indexes => {
                    const ordered = indexes
                        .map(index => ({index, pos: positions.get(index)}))
                        .sort((a, b) => a.pos.cx - b.pos.cx);
                    if (ordered.length < 2) return;

                    const firstX = ordered[0].pos.cx;
                    const lastX = ordered[ordered.length - 1].pos.cx;
                    const currentSpan = lastX - firstX;
                    const requiredSpan = (ordered.length - 1) * minLevelGap;
                    if (currentSpan >= requiredSpan) return;

                    const center = (firstX + lastX) / 2;
                    const start = center - requiredSpan / 2;
                    ordered.forEach((item, i) => {
                        item.pos.cx = start + i * minLevelGap;
                    });
                });
            }

            const minAllowedX = marginX + nodeWidth / 2;
            const minX = Math.min(...Array.from(positions.values()).map(pos => pos.cx));
            if (minX < minAllowedX) {
                const offsetX = minAllowedX - minX;
                positions.forEach(pos => { pos.cx += offsetX; });
            }

            const maxX = Math.max(...Array.from(positions.values()).map(pos => pos.cx));
            const svgWidth = Math.max(maxX + nodeWidth / 2 + marginX, window.innerWidth - 40);
            const svgHeight = marginY * 2 + (maxDepth + 1) * nodeHeight + maxDepth * vGap + 20;
            const pathSet = new Set(pathNodes);
            const pathOrder = new Map(pathNodes.map((index, step) => [index, step]));
            let edgeSvg = '';
            let nodeSvg = '';
            let labelSvg = '';

            for (let depth = 0; depth <= maxDepth; depth++) {
                const depthNodes = visibleNodes.filter(node => node.depth === depth);
                if (!depthNodes.length) continue;
                const y = marginY + depth * (nodeHeight + vGap) + 8;
                labelSvg += `<text class="depth-label" x="24" y="${y}">深度 ${depth}</text>`;
            }

            visibleNodes.forEach(node => {
                if (node.parentIndex < 0 || !positions.has(node.parentIndex)) return;
                const parent = positions.get(node.parentIndex);
                const child = positions.get(node.index);
                const x1 = parent.cx;
                const y1 = parent.y + 18 + boardSize + 18;
                const x2 = child.cx;
                const y2 = child.y + 18;
                const midY = (y1 + y2) / 2;
                const isSolutionEdge = pathSet.has(node.parentIndex) && pathSet.has(node.index);
                const isMuted = foundGoal && !isSolutionEdge;
                edgeSvg += `<path class="edge${isSolutionEdge ? ' solution' : ''}${isMuted ? ' muted-after-solution' : ''}" d="M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}"></path>`;
            });

            visibleNodes.forEach(node => {
                const pos = positions.get(node.index);
                nodeSvg += renderBoardSvg(
                    node,
                    pos.cx - nodeWidth / 2,
                    pos.y,
                    metrics,
                    pathOrder.has(node.index) ? pathOrder.get(node.index) : -1
                );
            });

            return `<svg class="tree-svg" width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" role="img" aria-label="八数码搜索树">${labelSvg}${edgeSvg}${nodeSvg}</svg>`;
        }

        function renderTree() {
            const content = document.getElementById('treeContent');
            const cellSize = getCellSize();
            document.documentElement.style.setProperty('--cell-size', cellSize + 'px');

            if (treeNodes.length === 0) {
                content.innerHTML = '<div style="color:#555;padding:100px;text-align:center;">点击"展开"开始</div>';
                return;
            }

            const visibleNodes = getVisibleNodes();
            const depths = visibleNodes.map(node => node.depth);
            content.innerHTML = `<div class="tree-container">${renderSvgTree(visibleNodes)}</div>`;

            document.getElementById('nodeCount').textContent = treeNodes.length;
            document.getElementById('maxDepth').textContent = Math.max(...depths, 0);

            if (foundGoal) {
                const moveText = getSolutionMoveText();
                document.getElementById('goalInfo').innerHTML =
                    `<span style="color:#00ff88;">已找到解！步数: ${pathNodes.length - 1}${moveText ? '，路径: ' + moveText : ''}</span>`;
                document.getElementById('expandBtn').disabled = true;
                document.getElementById('solveBtn').disabled = true;
            } else {
                document.getElementById('goalInfo').innerHTML = '';
                document.getElementById('expandBtn').disabled = false;
                document.getElementById('solveBtn').disabled = false;
            }
        }

        function expandNext(shouldRender = true) {
            if (foundGoal) return;

            const existing = new Set(treeNodes.map(n => boardKey(n.board)));
            let addedCount = 0;
            let expandedDepth = maxExpandedDepth;

            while (addedCount === 0 && expandedDepth <= 30 && !foundGoal) {
                const nodesAtDepth = treeNodes
                    .map((node, index) => ({...node, index}))
                    .filter(node => node.depth === expandedDepth);
                if (nodesAtDepth.length === 0) break;

                for (const node of nodesAtDepth) {
                    if (foundGoal) break;
                    for (const move of getMoves(node.board)) {
                        const newBoard = deepCopy(node.board);
                        const empty = findEmpty(newBoard);
                        newBoard[empty.r][empty.c] = newBoard[move.r][move.c];
                        newBoard[move.r][move.c] = 0;
                        const key = boardKey(newBoard);
                        if (!existing.has(key)) {
                            existing.add(key);
                            const newIndex = treeNodes.length;
                            const newNode = {
                                board: newBoard,
                                parentIndex: node.index,
                                depth: expandedDepth + 1,
                                moveName: move.name,
                                nodeNum: ++nodeCounter
                            };
                            treeNodes.push(newNode);
                            addedCount++;

                            if (boardEqual(newBoard, goalState)) {
                                foundGoal = true;
                                goalNodeIndex = newIndex;
                                pathNodes = buildPathToRoot(goalNodeIndex);
                                markGoalAncestors();
                                break;
                            }
                        }
                    }
                }

                if (addedCount === 0) {
                    expandedDepth++;
                }
            }

            if (addedCount === 0) return;
            maxExpandedDepth = expandedDepth + 1;
            if (shouldRender) renderTree();
        }

        function solveUntilGoal() {
            let guard = 0;
            while (!foundGoal && guard < 32) {
                const before = treeNodes.length;
                expandNext(false);
                if (treeNodes.length === before) break;
                guard++;
            }
            renderTree();
        }

        function expandTo(depth) { maxExpandedDepth = depth; renderTree(); }
        function collapseAll() { maxExpandedDepth = 0; renderTree(); }
        function zoomIn() {
            currentScale = Math.min(currentScale + 0.2, 2);
            document.getElementById('zoomLabel').textContent = `${Math.round(currentScale * 100)}%`;
            renderTree();
        }
        function zoomOut() {
            currentScale = Math.max(currentScale - 0.2, 0.4);
            document.getElementById('zoomLabel').textContent = `${Math.round(currentScale * 100)}%`;
            renderTree();
        }

        function setCustomState() {
            const input = document.getElementById('customInput').value.trim();
            if (!/^[0-8]{9}$/.test(input)) { alert('请输入9位数字(0-8)'); return; }
            const arr = input.split('').map(Number);
            const sorted = arr.slice().sort();
            if (sorted.join('') !== '012345678') { alert('必须包含0-8每个数字各一次'); return; }
            const board = [[arr[0],arr[1],arr[2]],[arr[3],arr[4],arr[5]],[arr[6],arr[7],arr[8]]];
            currentStartState = board;
            initTree();
        }

        function randomStart(steps) {
            let board = deepCopy(goalState);
            for (let i = 0; i < steps; i++) {
                const moves = getMoves(board);
                const move = moves[Math.floor(Math.random() * moves.length)];
                const empty = findEmpty(board);
                board[empty.r][empty.c] = board[move.r][move.c];
                board[move.r][move.c] = 0;
            }
            if (boardEqual(board, goalState)) { randomStart(steps); return; }
            currentStartState = board;
            initTree();
        }

        function initTree() {
            foundGoal = false;
            goalNodeIndex = -1;
            pathNodes = [];
            goalAncestors.clear();
            treeNodes = [{
                board: deepCopy(currentStartState || [[1,0,3],[8,2,4],[7,6,5]]),
                parentIndex: -1, depth: 0, moveName: '', nodeNum: 1
            }];
            nodeCounter = 1;
            maxExpandedDepth = 0;
            renderTree();
        }

        function resetTree() { initTree(); }
        initTree();
    </script>
</body>
