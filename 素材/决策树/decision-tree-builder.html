<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>决策树绘制工具</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d6dde8;
      --root: #e85d75;
      --root-soft: #fde7ed;
      --decision: #2f7d5b;
      --decision-soft: #e4f5ec;
      --leaf: #326bff;
      --leaf-soft: #eaf1ff;
      --amber: #f2ad2e;
      --shadow: 0 12px 30px rgba(31, 41, 55, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      overflow-x: auto;
      z-index: 5;
    }

    .brand {
      min-width: 210px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--decision);
      font-weight: 900;
    }

    .tree-field {
      height: 38px;
      min-width: 190px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .tree-purpose-field {
      min-width: 320px;
    }

    .tree-field input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }

    .tree-field input::placeholder {
      color: #98a2b3;
      font-weight: 500;
    }

    button {
      height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
    }

    button:hover { border-color: #aab7ca; }
    button.primary { color: #fff; border-color: var(--decision); background: var(--decision); }
    button.active { color: var(--leaf); border-color: var(--leaf); background: var(--leaf-soft); font-weight: 700; }
    button.danger { color: #b42318; }

    .spacer { flex: 1; }

    .hint {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .workspace {
      position: relative;
      overflow: hidden;
      cursor: grab;
      background:
        linear-gradient(rgba(47, 125, 91, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(47, 125, 91, 0.05) 1px, transparent 1px),
        var(--bg);
      background-size: 24px 24px;
    }

    .workspace.panning { cursor: grabbing; }

    .scene {
      position: absolute;
      left: 0;
      top: 0;
      width: 2600px;
      height: 1800px;
      transform-origin: 0 0;
    }

    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .tree-card {
      position: absolute;
      left: 96px;
      top: 48px;
      z-index: 3;
      width: 430px;
      min-height: 106px;
      padding: 16px 18px;
      border: 1px solid rgba(214, 221, 232, 0.92);
      border-left: 5px solid var(--decision);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 26px rgba(31, 41, 55, 0.09);
      pointer-events: none;
    }

    .tree-card-kicker {
      color: var(--decision);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .tree-card h1 {
      margin: 5px 0 6px;
      color: var(--ink);
      font-size: 23px;
      line-height: 1.22;
    }

    .tree-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      line-height: 1.6;
    }

    .node {
      position: absolute;
      min-width: 136px;
      max-width: 250px;
      min-height: 56px;
      padding: 12px 16px;
      border: 2px solid var(--decision);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      color: var(--ink);
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      user-select: none;
      cursor: grab;
      z-index: 2;
    }

    .node.root {
      border-color: var(--root);
      background: var(--root-soft);
    }

    .node.decision {
      border-color: var(--decision);
      background: var(--decision-soft);
    }

    .node.leaf {
      border-color: var(--leaf);
      background: var(--leaf-soft);
    }

    .node.selected {
      outline: 4px solid rgba(50, 107, 255, 0.22);
      border-color: var(--leaf);
    }

    .node.connect-source {
      outline: 4px solid rgba(242, 173, 46, 0.34);
      border-color: var(--amber);
    }

    .node:active { cursor: grabbing; }

    .edge-path {
      fill: none;
      stroke: #526173;
      stroke-width: 2.2;
      marker-end: url(#arrow);
      cursor: pointer;
    }

    .edge-path.selected {
      stroke: var(--leaf);
      stroke-width: 3.2;
    }

    .edge-label-bg {
      fill: #fff;
      stroke: var(--line);
      stroke-width: 1;
      rx: 6;
    }

    .edge-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .floating-editor {
      position: absolute;
      z-index: 10;
      display: none;
      min-width: 180px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .floating-editor.node-editor {
      padding: 6px;
    }

    .floating-editor input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      outline: none;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }

    .floating-editor input:focus {
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(50, 107, 255, 0.14);
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      background: rgba(31, 41, 55, 0.88);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="brand">
        <div class="brand-mark">树</div>
        <div>决策树绘制工具</div>
      </div>
      <label class="tree-field">
        <span>名称</span>
        <input id="treeName" maxlength="24" placeholder="给这棵树取个名字" />
      </label>
      <label class="tree-field tree-purpose-field">
        <span>用途</span>
        <input id="treePurpose" maxlength="60" placeholder="这棵树用来判断什么？" />
      </label>
      <button id="addRoot">＋ 根节点</button>
      <button class="primary" id="addDecision">＋ 判断节点</button>
      <button id="addLeaf">＋ 叶子节点</button>
      <button id="connectMode">↗ 连线</button>
      <button id="editSelected">✎ 编辑</button>
      <button class="danger" id="deleteSelected">⌫ 删除</button>
      <button class="danger" id="clearTree">清空</button>
      <button id="exportPng">⇩ 导出图片</button>
      <button id="resetDemo">↺ 示例</button>
      <button id="centerView">⌖ 视图居中</button>
      <div class="spacer"></div>
      <div class="legend">
        <span class="swatch" style="background: var(--root-soft); border-color: var(--root);"></span>根
        <span class="swatch" style="background: var(--decision-soft); border-color: var(--decision);"></span>判断
        <span class="swatch" style="background: var(--leaf-soft); border-color: var(--leaf);"></span>叶子
      </div>
      <div class="hint" id="hint">双击节点改名；双击连线文字可改条件。</div>
    </header>

    <main class="workspace" id="workspace">
      <div class="scene" id="scene">
        <svg id="canvas" aria-label="决策树画布">
          <defs>
            <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
              <path d="M2,2 L10,6 L2,10 Z" fill="#526173"></path>
            </marker>
          </defs>
        </svg>
        <section class="tree-card" aria-label="决策树信息">
          <div class="tree-card-kicker">决策树名称</div>
          <h1 id="treeCardName"></h1>
          <p id="treeCardPurpose"></p>
        </section>
      </div>
      <div class="floating-editor" id="editor">
        <input id="editorInput" autocomplete="off" />
      </div>
      <div class="toast" id="toast"></div>
    </main>
  </div>

  <script>
    const workspace = document.getElementById("workspace");
    const scene = document.getElementById("scene");
    const svg = document.getElementById("canvas");
    const editor = document.getElementById("editor");
    const editorInput = document.getElementById("editorInput");
    const toast = document.getElementById("toast");
    const treeNameInput = document.getElementById("treeName");
    const treePurposeInput = document.getElementById("treePurpose");
    const treeCardName = document.getElementById("treeCardName");
    const treeCardPurpose = document.getElementById("treeCardPurpose");
    const WORLD_WIDTH = 2600;
    const WORLD_HEIGHT = 1800;
    const DEFAULT_TREE_NAME = "未命名决策树";
    const EMPTY_TREE_PURPOSE = "先写一句话：这棵树用来判断什么？";
    const TREE_INFO_CARD = { x: 96, y: 48, w: 430, h: 106 };

    const palette = {
      root: { fill: "#fde7ed", stroke: "#e85d75" },
      decision: { fill: "#e4f5ec", stroke: "#2f7d5b" },
      leaf: { fill: "#eaf1ff", stroke: "#326bff" },
    };

    const state = {
      nodes: [],
      edges: [],
      selected: null,
      connectMode: false,
      connectSource: null,
      dragging: null,
      panning: null,
      panX: 0,
      panY: 0,
      editing: null,
      treeName: DEFAULT_TREE_NAME,
      treePurpose: "",
      nextNodeId: 1,
      nextEdgeId: 1,
    };

    function seedDemo() {
      state.nodes = [];
      state.edges = [];
      state.selected = null;
      state.connectSource = null;
      state.connectMode = false;
      state.nextNodeId = 1;
      state.nextEdgeId = 1;
      setTreeInfo(
        "动物分类决策树",
        "根据动物特征一步步判断类别，练习把复杂问题拆成连续的条件选择。"
      );
      centerView();

      const root = addNode("有羽毛吗？", 650, 172, "root");
      const bird = addNode("鸟类", 300, 335, "leaf");
      const water = addNode("生活在水中吗？", 740, 335, "decision");
      const fish = addNode("鱼类", 590, 500, "leaf");
      const milk = addNode("会吃奶吗？", 900, 500, "decision");
      const mammal = addNode("哺乳动物", 750, 665, "leaf");
      const other = addNode("其他动物", 1050, 665, "leaf");

      addEdge(root.id, bird.id, "是");
      addEdge(root.id, water.id, "否");
      addEdge(water.id, fish.id, "是");
      addEdge(water.id, milk.id, "否");
      addEdge(milk.id, mammal.id, "是");
      addEdge(milk.id, other.id, "否");
      render();
    }

    function setTreeInfo(name, purpose) {
      state.treeName = name.trim() || DEFAULT_TREE_NAME;
      state.treePurpose = purpose.trim();
      treeNameInput.value = state.treeName;
      treePurposeInput.value = state.treePurpose;
      renderTreeInfo();
    }

    function syncTreeInfoFromInputs() {
      state.treeName = treeNameInput.value.trim() || DEFAULT_TREE_NAME;
      state.treePurpose = treePurposeInput.value.trim();
      renderTreeInfo();
    }

    function renderTreeInfo() {
      treeCardName.textContent = state.treeName || DEFAULT_TREE_NAME;
      treeCardPurpose.textContent = state.treePurpose || EMPTY_TREE_PURPOSE;
    }

    function addNode(text, x, y, type) {
      const node = { id: `n${state.nextNodeId++}`, text, x, y, type, w: 150, h: 64 };
      state.nodes.push(node);
      render();
      return node;
    }

    function addEdge(from, to, label = "条件") {
      if (from === to) {
        showToast("不能把节点连到自己。");
        return null;
      }
      if (state.edges.some(edge => edge.from === from && edge.to === to)) {
        showToast("这两个节点已经有一条线了。");
        return null;
      }
      const edge = { id: `e${state.nextEdgeId++}`, from, to, label };
      state.edges.push(edge);
      return edge;
    }

    function nodeById(id) {
      return state.nodes.find(node => node.id === id);
    }

    function select(kind, id, shouldRender = true) {
      state.selected = { kind, id };
      if (shouldRender) render();
      else refreshSelectionClasses();
    }

    function refreshSelectionClasses() {
      document.querySelectorAll(".node").forEach(el => {
        el.classList.toggle("selected", state.selected?.kind === "node" && state.selected.id === el.dataset.id);
      });
      document.querySelectorAll(".edge").forEach(group => {
        const selected = state.selected?.kind === "edge" && state.selected.id === group.dataset.id;
        group.querySelector(".edge-path")?.classList.toggle("selected", selected);
      });
    }

    function clearSelection() {
      state.selected = null;
      state.connectSource = null;
      render();
    }

    function render() {
      document.querySelectorAll(".node").forEach(node => node.remove());
      Array.from(svg.querySelectorAll(".edge")).forEach(edge => edge.remove());
      applyPan();
      state.edges.forEach(renderEdge);
      state.nodes.forEach(renderNode);
      document.getElementById("connectMode").classList.toggle("active", state.connectMode);
      updateHint();
    }

    function renderNode(node) {
      const el = document.createElement("div");
      el.className = `node ${node.type}`;
      if (state.selected?.kind === "node" && state.selected.id === node.id) el.classList.add("selected");
      if (state.connectSource === node.id) el.classList.add("connect-source");
      el.style.left = `${node.x}px`;
      el.style.top = `${node.y}px`;
      el.textContent = node.text;
      el.dataset.id = node.id;
      scene.appendChild(el);

      requestAnimationFrame(() => {
        const rect = el.getBoundingClientRect();
        node.w = rect.width;
        node.h = rect.height;
      });

      el.addEventListener("pointerdown", event => {
        if (state.connectMode) return;
        event.stopPropagation();
        select("node", node.id, false);
        state.dragging = {
          id: node.id,
          startX: event.clientX,
          startY: event.clientY,
          nodeX: node.x,
          nodeY: node.y,
          moved: false,
        };
        el.setPointerCapture(event.pointerId);
      });

      el.addEventListener("pointermove", event => {
        if (!state.dragging || state.dragging.id !== node.id) return;
        const dx = event.clientX - state.dragging.startX;
        const dy = event.clientY - state.dragging.startY;
        if (Math.abs(dx) + Math.abs(dy) > 3) state.dragging.moved = true;
        node.x = clamp(state.dragging.nodeX + dx, 12, WORLD_WIDTH - node.w - 12);
        node.y = clamp(state.dragging.nodeY + dy, 12, WORLD_HEIGHT - node.h - 12);
        el.style.left = `${node.x}px`;
        el.style.top = `${node.y}px`;
        redrawEdges();
      });

      el.addEventListener("pointerup", () => {
        state.dragging = null;
      });

      el.addEventListener("click", event => {
        event.stopPropagation();
        if (!state.connectMode) {
          select("node", node.id, false);
          return;
        }
        if (!state.connectSource) {
          state.connectSource = node.id;
          render();
          return;
        }
        const newEdge = addEdge(state.connectSource, node.id, "条件");
        state.connectSource = null;
        state.connectMode = false;
        if (newEdge) select("edge", newEdge.id);
        render();
        if (newEdge) openEditor("edge", newEdge.id);
      });

      el.addEventListener("dblclick", event => {
        event.preventDefault();
        event.stopPropagation();
        state.dragging = null;
        openEditor("node", node.id);
      });
    }

    function renderEdge(edge) {
      const from = nodeById(edge.from);
      const to = nodeById(edge.to);
      if (!from || !to) return;

      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.classList.add("edge");
      group.dataset.id = edge.id;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.classList.add("edge-path");
      if (state.selected?.kind === "edge" && state.selected.id === edge.id) path.classList.add("selected");
      path.setAttribute("d", pathFor(from, to));

      const mid = midPoint(from, to);
      const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bg.classList.add("edge-label-bg");
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.classList.add("edge-label");
      text.textContent = edge.label || "条件";
      text.setAttribute("x", mid.x);
      text.setAttribute("y", mid.y - 8);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "middle");

      group.append(path, bg, text);
      svg.appendChild(group);
      positionLabelBg(bg, text);

      group.addEventListener("click", event => {
        event.stopPropagation();
        select("edge", edge.id, false);
      });

      group.addEventListener("dblclick", event => {
        event.preventDefault();
        event.stopPropagation();
        openEditor("edge", edge.id);
      });
    }

    function redrawEdges() {
      state.edges.forEach(edge => {
        const group = svg.querySelector(`.edge[data-id="${edge.id}"]`);
        const from = nodeById(edge.from);
        const to = nodeById(edge.to);
        if (!group || !from || !to) return;
        const path = group.querySelector(".edge-path");
        const text = group.querySelector(".edge-label");
        const bg = group.querySelector(".edge-label-bg");
        const mid = midPoint(from, to);
        path.setAttribute("d", pathFor(from, to));
        text.setAttribute("x", mid.x);
        text.setAttribute("y", mid.y - 8);
        positionLabelBg(bg, text);
      });
    }

    function center(node) {
      return { x: node.x + node.w / 2, y: node.y + node.h / 2 };
    }

    function anchor(from, to) {
      const a = center(from);
      const b = center(to);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      if (Math.abs(dx) / Math.max(1, from.w) > Math.abs(dy) / Math.max(1, from.h)) {
        return {
          from: { x: a.x + Math.sign(dx) * from.w / 2, y: a.y },
          to: { x: b.x - Math.sign(dx) * to.w / 2, y: b.y },
        };
      }
      return {
        from: { x: a.x, y: a.y + Math.sign(dy) * from.h / 2 },
        to: { x: b.x, y: b.y - Math.sign(dy) * to.h / 2 },
      };
    }

    function pathFor(from, to) {
      const p = anchor(from, to);
      const curve = Math.max(38, Math.abs(p.to.y - p.from.y) * 0.45);
      return `M ${p.from.x} ${p.from.y} C ${p.from.x} ${p.from.y + curve}, ${p.to.x} ${p.to.y - curve}, ${p.to.x} ${p.to.y}`;
    }

    function midPoint(from, to) {
      const p = anchor(from, to);
      return { x: (p.from.x + p.to.x) / 2, y: (p.from.y + p.to.y) / 2 };
    }

    function positionLabelBg(bg, text) {
      requestAnimationFrame(() => {
        const box = text.getBBox();
        bg.setAttribute("x", box.x - 9);
        bg.setAttribute("y", box.y - 5);
        bg.setAttribute("width", box.width + 18);
        bg.setAttribute("height", box.height + 10);
      });
    }

    function openEditor(kind, id) {
      const item = kind === "node" ? nodeById(id) : state.edges.find(edge => edge.id === id);
      if (!item) return;
      state.editing = { kind, id };
      select(kind, id, false);
      editorInput.value = kind === "node" ? item.text : item.label;
      const pos = editorPosition(kind, id);
      editor.classList.toggle("node-editor", kind === "node");
      editor.style.left = `${pos.x}px`;
      editor.style.top = `${pos.y}px`;
      editor.style.width = `${pos.w}px`;
      editor.style.display = "block";
      editorInput.focus();
      editorInput.select();
    }

    function editorPosition(kind, id) {
      if (kind === "node") {
        const node = nodeById(id);
        return {
          x: clamp(node.x + state.panX, 8, workspace.clientWidth - 250),
          y: clamp(node.y + state.panY, 8, workspace.clientHeight - 58),
          w: clamp(node.w + 12, 190, 280),
        };
      }
      const edge = state.edges.find(e => e.id === id);
      const from = nodeById(edge.from);
      const to = nodeById(edge.to);
      const mid = midPoint(from, to);
      return {
        x: clamp(mid.x + state.panX - 90, 8, workspace.clientWidth - 210),
        y: clamp(mid.y + state.panY + 8, 8, workspace.clientHeight - 58),
        w: 190,
      };
    }

    function commitEditor() {
      if (!state.editing) return;
      const value = editorInput.value.trim() || "未命名";
      if (state.editing.kind === "node") {
        const node = nodeById(state.editing.id);
        if (node) node.text = value;
      } else {
        const edge = state.edges.find(item => item.id === state.editing.id);
        if (edge) edge.label = value;
      }
      closeEditor();
      render();
    }

    function closeEditor() {
      state.editing = null;
      editor.style.display = "none";
      editor.classList.remove("node-editor");
    }

    function deleteSelected() {
      if (!state.selected) return;
      if (state.selected.kind === "node") {
        const id = state.selected.id;
        state.nodes = state.nodes.filter(node => node.id !== id);
        state.edges = state.edges.filter(edge => edge.from !== id && edge.to !== id);
      } else {
        state.edges = state.edges.filter(edge => edge.id !== state.selected.id);
      }
      state.selected = null;
      closeEditor();
      render();
    }

    function clearTree() {
      const hasContent = state.nodes.length || state.edges.length || treeNameInput.value.trim() || treePurposeInput.value.trim();
      if (!hasContent) {
        showToast("画布已经是空的。");
        return;
      }
      if (!window.confirm("确定清空当前决策树吗？名称、用途和所有节点都会清除。")) return;
      state.nodes = [];
      state.edges = [];
      state.selected = null;
      state.connectMode = false;
      state.connectSource = null;
      state.nextNodeId = 1;
      state.nextEdgeId = 1;
      setTreeInfo(DEFAULT_TREE_NAME, "");
      closeEditor();
      centerView();
      render();
      showToast("已清空，可以开始新的决策树。");
    }

    async function exportPng() {
      closeEditor();
      clearSelection();
      await nextFrame();
      await nextFrame();
      if (!state.nodes.length) {
        showToast("画布上还没有节点。");
        return;
      }

      const bounds = getTreeBounds(96);
      const scale = 2;
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(bounds.w * scale);
      canvas.height = Math.ceil(bounds.h * scale);
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.translate(-bounds.x, -bounds.y);

      drawExportBackground(ctx, bounds);
      drawExportTreeInfo(ctx);
      state.edges.forEach(edge => drawExportEdge(ctx, edge));
      state.nodes.forEach(node => drawExportNode(ctx, node));

      canvas.toBlob(blob => {
        if (!blob) {
          showToast("导出失败，请稍后再试。");
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = `${safeFileName(state.treeName || DEFAULT_TREE_NAME)}.png`;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast("图片已导出。");
      }, "image/png");
    }

    function nextFrame() {
      return new Promise(resolve => requestAnimationFrame(resolve));
    }

    function getTreeBounds(padding) {
      const xs = [];
      const ys = [];
      state.nodes.forEach(node => {
        xs.push(node.x, node.x + node.w);
        ys.push(node.y, node.y + node.h);
      });
      xs.push(TREE_INFO_CARD.x, TREE_INFO_CARD.x + TREE_INFO_CARD.w);
      ys.push(TREE_INFO_CARD.y, TREE_INFO_CARD.y + TREE_INFO_CARD.h);
      state.edges.forEach(edge => {
        const from = nodeById(edge.from);
        const to = nodeById(edge.to);
        if (!from || !to) return;
        const p = anchor(from, to);
        const mid = midPoint(from, to);
        xs.push(p.from.x, p.to.x, mid.x);
        ys.push(p.from.y, p.to.y, mid.y);
      });
      const minX = Math.min(...xs) - padding;
      const minY = Math.min(...ys) - padding;
      const maxX = Math.max(...xs) + padding;
      const maxY = Math.max(...ys) + padding;
      return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    }

    function drawExportBackground(ctx, bounds) {
      ctx.fillStyle = "#f7f9fc";
      ctx.fillRect(bounds.x, bounds.y, bounds.w, bounds.h);
      ctx.strokeStyle = "rgba(47, 125, 91, 0.08)";
      ctx.lineWidth = 1;
      const grid = 24;
      const startX = Math.floor(bounds.x / grid) * grid;
      const startY = Math.floor(bounds.y / grid) * grid;
      for (let x = startX; x <= bounds.x + bounds.w; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, bounds.y);
        ctx.lineTo(x, bounds.y + bounds.h);
        ctx.stroke();
      }
      for (let y = startY; y <= bounds.y + bounds.h; y += grid) {
        ctx.beginPath();
        ctx.moveTo(bounds.x, y);
        ctx.lineTo(bounds.x + bounds.w, y);
        ctx.stroke();
      }
    }

    function drawExportTreeInfo(ctx) {
      ctx.save();
      roundedRect(ctx, TREE_INFO_CARD.x, TREE_INFO_CARD.y, TREE_INFO_CARD.w, TREE_INFO_CARD.h, 8);
      ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
      ctx.fill();
      ctx.strokeStyle = "#d6dde8";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#2f7d5b";
      ctx.fillRect(TREE_INFO_CARD.x, TREE_INFO_CARD.y, 5, TREE_INFO_CARD.h);
      ctx.font = "900 13px Microsoft YaHei, PingFang SC, sans-serif";
      ctx.fillStyle = "#2f7d5b";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("决策树名称", TREE_INFO_CARD.x + 18, TREE_INFO_CARD.y + 16);
      ctx.font = "900 23px Microsoft YaHei, PingFang SC, sans-serif";
      ctx.fillStyle = "#1f2937";
      ctx.fillText(state.treeName || DEFAULT_TREE_NAME, TREE_INFO_CARD.x + 18, TREE_INFO_CARD.y + 38, TREE_INFO_CARD.w - 36);
      ctx.font = "650 14px Microsoft YaHei, PingFang SC, sans-serif";
      ctx.fillStyle = "#667085";
      drawWrappedTextLeft(
        ctx,
        state.treePurpose || EMPTY_TREE_PURPOSE,
        TREE_INFO_CARD.x + 18,
        TREE_INFO_CARD.y + 70,
        TREE_INFO_CARD.w - 36,
        20,
        2
      );
      ctx.restore();
    }

    function drawExportEdge(ctx, edge) {
      const from = nodeById(edge.from);
      const to = nodeById(edge.to);
      if (!from || !to) return;
      const p = anchor(from, to);
      const curve = Math.max(38, Math.abs(p.to.y - p.from.y) * 0.45);
      const c1 = { x: p.from.x, y: p.from.y + curve };
      const c2 = { x: p.to.x, y: p.to.y - curve };
      ctx.save();
      ctx.strokeStyle = "#526173";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(p.from.x, p.from.y);
      ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, p.to.x, p.to.y);
      ctx.stroke();
      drawArrowHead(ctx, c2, p.to);
      const mid = midPoint(from, to);
      drawExportEdgeLabel(ctx, edge.label || "条件", mid.x, mid.y - 8);
      ctx.restore();
    }

    function drawArrowHead(ctx, control, end) {
      const angle = Math.atan2(end.y - control.y, end.x - control.x);
      const length = 13;
      const wing = 0.55;
      ctx.fillStyle = "#526173";
      ctx.beginPath();
      ctx.moveTo(end.x, end.y);
      ctx.lineTo(end.x - length * Math.cos(angle - wing), end.y - length * Math.sin(angle - wing));
      ctx.lineTo(end.x - length * Math.cos(angle + wing), end.y - length * Math.sin(angle + wing));
      ctx.closePath();
      ctx.fill();
    }

    function drawExportEdgeLabel(ctx, text, x, y) {
      ctx.font = "700 14px Microsoft YaHei, PingFang SC, sans-serif";
      const width = Math.min(Math.max(ctx.measureText(text).width + 18, 34), 360);
      roundedRect(ctx, x - width / 2, y - 13, width, 26, 6);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.strokeStyle = "#d6dde8";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = "#1f2937";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x, y, width - 12);
    }

    function drawExportNode(ctx, node) {
      const colors = palette[node.type] || palette.decision;
      ctx.save();
      ctx.shadowColor = "rgba(31, 41, 55, 0.12)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 8;
      roundedRect(ctx, node.x, node.y, node.w, node.h, 8);
      ctx.fillStyle = colors.fill;
      ctx.fill();
      ctx.shadowColor = "transparent";
      ctx.strokeStyle = colors.stroke;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "800 16px Microsoft YaHei, PingFang SC, sans-serif";
      ctx.fillStyle = "#1f2937";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      drawWrappedText(ctx, node.text, node.x + node.w / 2, node.y + node.h / 2, node.w - 28, 21);
      ctx.restore();
    }

    function drawWrappedText(ctx, text, centerX, centerY, maxWidth, lineHeight) {
      const sourceLines = String(text).split("\n");
      const lines = [];
      sourceLines.forEach(source => {
        let current = "";
        Array.from(source).forEach(char => {
          const next = current + char;
          if (current && ctx.measureText(next).width > maxWidth) {
            lines.push(current);
            current = char;
          } else {
            current = next;
          }
        });
        lines.push(current || " ");
      });
      const totalHeight = (lines.length - 1) * lineHeight;
      lines.forEach((line, index) => {
        ctx.fillText(line, centerX, centerY - totalHeight / 2 + index * lineHeight, maxWidth);
      });
    }

    function drawWrappedTextLeft(ctx, text, x, y, maxWidth, lineHeight, maxLines = 2) {
      const lines = [];
      let current = "";
      Array.from(String(text)).forEach(char => {
        const next = current + char;
        if (current && ctx.measureText(next).width > maxWidth) {
          lines.push(current);
          current = char;
        } else {
          current = next;
        }
      });
      if (current) lines.push(current);
      const visibleLines = lines.slice(0, maxLines);
      if (lines.length > maxLines) {
        visibleLines[maxLines - 1] = `${visibleLines[maxLines - 1].slice(0, -1)}…`;
      }
      visibleLines.forEach((line, index) => {
        ctx.fillText(line, x, y + index * lineHeight, maxWidth);
      });
    }

    function roundedRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function applyPan() {
      scene.style.transform = `translate(${state.panX}px, ${state.panY}px)`;
      workspace.style.backgroundPosition = `${state.panX}px ${state.panY}px, ${state.panX}px ${state.panY}px, 0 0`;
    }

    function centerView() {
      state.panX = Math.round((workspace.clientWidth - 1280) / 2);
      state.panY = 8;
      applyPan();
      closeEditor();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function updateHint() {
      const hint = document.getElementById("hint");
      if (state.connectMode && !state.connectSource) hint.textContent = "连线模式：先点击起点节点。";
      else if (state.connectMode && state.connectSource) hint.textContent = "连线模式：再点击目标节点，然后可编辑线上的文字。";
      else hint.textContent = "先写名称和用途；双击节点改名；双击连线文字可改条件。";
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function safeFileName(value) {
      return String(value)
        .trim()
        .replace(/[\\/:*?"<>|]/g, "-")
        .replace(/\s+/g, "")
        .slice(0, 40) || "decision-tree";
    }

    document.getElementById("addRoot").addEventListener("click", () => {
      const node = addNode("根节点问题？", 650, 172, "root");
      select("node", node.id);
      openEditor("node", node.id);
    });

    document.getElementById("addDecision").addEventListener("click", () => {
      const node = addNode("新的判断？", 720 + Math.random() * 120, 335 + Math.random() * 90, "decision");
      select("node", node.id);
      openEditor("node", node.id);
    });

    document.getElementById("addLeaf").addEventListener("click", () => {
      const node = addNode("叶子结果", 820 + Math.random() * 120, 520 + Math.random() * 90, "leaf");
      select("node", node.id);
      openEditor("node", node.id);
    });

    document.getElementById("connectMode").addEventListener("click", () => {
      state.connectMode = !state.connectMode;
      state.connectSource = null;
      closeEditor();
      render();
    });

    document.getElementById("editSelected").addEventListener("click", () => {
      if (!state.selected) {
        showToast("请先选择节点或连线。");
        return;
      }
      openEditor(state.selected.kind, state.selected.id);
    });

    document.getElementById("deleteSelected").addEventListener("click", deleteSelected);
    document.getElementById("clearTree").addEventListener("click", clearTree);
    document.getElementById("exportPng").addEventListener("click", exportPng);
    document.getElementById("resetDemo").addEventListener("click", seedDemo);
    document.getElementById("centerView").addEventListener("click", centerView);
    treeNameInput.addEventListener("input", syncTreeInfoFromInputs);
    treePurposeInput.addEventListener("input", syncTreeInfoFromInputs);

    workspace.addEventListener("pointerdown", event => {
      if (event.target !== workspace && event.target !== svg) return;
      closeEditor();
      state.panning = {
        startX: event.clientX,
        startY: event.clientY,
        panX: state.panX,
        panY: state.panY,
      };
      workspace.classList.add("panning");
      workspace.setPointerCapture(event.pointerId);
    });

    workspace.addEventListener("pointermove", event => {
      if (!state.panning) return;
      state.panX = state.panning.panX + event.clientX - state.panning.startX;
      state.panY = state.panning.panY + event.clientY - state.panning.startY;
      applyPan();
    });

    workspace.addEventListener("pointerup", () => {
      state.panning = null;
      workspace.classList.remove("panning");
    });

    workspace.addEventListener("pointercancel", () => {
      state.panning = null;
      workspace.classList.remove("panning");
    });

    workspace.addEventListener("click", event => {
      if (event.target === workspace || event.target === svg) clearSelection();
    });

    editorInput.addEventListener("keydown", event => {
      if (event.key === "Enter") commitEditor();
      if (event.key === "Escape") closeEditor();
    });
    editorInput.addEventListener("blur", commitEditor);

    window.addEventListener("keydown", event => {
      if (document.activeElement === treeNameInput || document.activeElement === treePurposeInput) return;
      if (event.key === "Delete" || event.key === "Backspace") {
        if (document.activeElement === editorInput) return;
        deleteSelected();
      }
      if (event.key === "Escape") {
        state.connectMode = false;
        state.connectSource = null;
        closeEditor();
        render();
      }
    });

    window.addEventListener("resize", () => {
      applyPan();
      redrawEdges();
    });

    seedDemo();
  </script>
</body>
</html>
